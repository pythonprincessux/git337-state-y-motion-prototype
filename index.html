<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <header>
    <p class="eyebrow">Module 6 Practice</p>
    <h1>State and Motion Prototype</h1>
    <p>Use the controls below to register for a community workshop and review your selection.</p>
  </header>
  <main>
    <section class="specimen">
      <h2>Action</h2>
      <p><a class="action" href="#confirmation">Review Registration</a></p>
    </section>
    <section class="specimen">
      <h2>Selection</h2>
      <div class="choice">
        <input type="checkbox" id="choice">
        <label for="choice">
          <span class="choice-title">Community Workshop</span>
          <span class="choice-help">Select this option to include a workshop seat in your registration.</span>
        </label>
      </div>
    </section>
    <section class="specimen">
      <h2>Disclosure</h2>
      <details>
        <summary>Review registration details</summary>
        <div class="confirmation" id="confirmation">
          <strong>Registration ready.</strong> Review your selection before continuing.
        </div>
      </details>
    </section>
  </main>
</body>

</html>
